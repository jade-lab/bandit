name: Test multi-edition Jekyll build

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build:
    name: Build multi-edition site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Build editions
        run: ./_tools/build_editions.sh
        env:
          JEKYLL_ENV: production
          CURRENT_YEAR: '2026'
          SITE_BASE: /bandit
          LOCAL_PREFIX: ''
          OUTPUT_DIR: _site
