title: BANDIT - Workshop on Big data analysis AND Illicit Trends
preposition: at
description: >-
  December 14-17, 2026 @ Phoenix, Arizona, USA -- Held with 2026 IEEE International Conference on Big Data (IEEE BigData 2026)
baseurl: "/bandit/" # the subpath of your site, e.g. /blog
url: "https://jade-lab.github.io" # the base hostname & protocol for your site, e.g. https://example.com

# Remote Theme to use
remote_theme: "DigitaleGesellschaft/jekyll-theme-conference@v3.6.1" #alternative "DigitaleGesellschaft/jekyll-theme-conference@v3.6.1"

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache

# Build settings
markdown: kramdown
sass:
  style: compressed

# Additional exclude from processing
exclude:
  - vendor
  - .github/
  - README.md
  - LICENSE.md
  - REDISTRIBUTED.md
  - purgecss.config.js

# Collections and their defaults
collections:
  talks:
    output: true
    permalink: /:collection/:title/
  speakers:
    output: true
    permalink: /:collection/:title/
  rooms:
    output: true
    permalink: /:collection/:title/

defaults:
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
  - scope:
      path: ""
      type: speakers
    values:
      layout: speaker
  - scope:
      path: ""
      type: rooms
    values:
      layout: room


conference:

  # Language
  lang: en

  # Timezone
  tz: "+02:00"

  # Show theme errors:
  show_errors: False

  # Navigation bar
  navigation:
    logo:
      name: bandit.25
      img: 'logo.png'
      url: '/bandit/'
    breakpoint: md
    links:
      - name: CFP
        relative_url: /cfp/
      - name: Program
        relative_url: /program/
      - name: Accepted Papers
        relative_url: /talks/
      #- name: Speakers
      #  relative_url: /speakers/
      - name: Venue
        relative_url: /location/
      - name: Register
        absolute_url: "https://bigdataieee.org/BigData2026/index.html"
      - name: "More"
        disable: true
        relative_url: false
        menu:
          - name: Previous Editions
            absolute_url: /bandit/editions/

  # Link Preview for Sharing
  link_preview:
    # also adapt "preposition" property at top for more meaningful descriptions
    disable: false
    img:
      twitter: 'twitter_preview.png'      # inside /assets/images/
      open_graph: 'facebook_preview.png'  # inside /assets/images/

  # Main landing page
  main:
    #logo:
    #  img: 'splash_2025_macau.jpg'
    links:
      - name: Program
        relative_url: /program/
      - name: How to get there
        relative_url: /location/
      - name: Tickets
        disabled: true
        absolute_url: ''

  # Information boxes
  info_bars:
    - title: BANDIT 2026
      color: primary
      main_only: true
      text: |
        ---
        Details for BANDIT 2026 will be announced soon.

    # - title: Archived page!
    #   color: warning
    #   main_only: false
    #   text: |
    #     You are looking at an archived page of the 2025 edition.
    #     Got to [current edition](/bandit/).
    
    # - title: List of Accepted Papers available now!
    #   color: primary
    #   main_only: true
    #   text: |
    #     ---
    #     **Check the Programme and the Accepted Papers below:**

    #     Links:
    #     - [Workshop Programme](/bandit/program/)
    #     - [Accepted Papers](/bandit/talks/)
    # - text: Remember to [submit your paper](https://wi-lab.com/cyberchair/2025/bigdata25/scripts/ws_submit.php) before **Nov 02** for the **second cycle** and to use the [IEEE 2-column format](https://www.ieee.org/conferences/publishing/templates)
    #   color: warning
    #   pages_only: true

  # Live indications
  live:
    date: 14.12.2025
    timezone: GMT-7
    stop:       240  # in minutes
    streaming:
      enable: true
      pause:     60  # in minutes
      prepend:    5  # in minutes
      extend:     5  # in minutes
    demo:
      enable: false
      duration: 300  # in seconds
      pause:     10  # in seconds

  talks:
    # Talk categories
    main_categories:
      - name: Full Papers
        color: info
      - name: Short Papers
        color: success
      - name: Keynote
        color:  dark
  # - `secondary` (your website's secondary color, normally grey)
  # - `success` (green)
  # - `alert` (red)
  # - `warning` (yellow)
  # - `info` (blue)
  # - `light` (white)
  # - `dark` (dark grey)

    # Hide icons on talk overview page
    hide_icons: false

  speakers:
    # Show first and last name
    show_firstname: true

  location:
    # Disable links to locations
    hide: false
    # URL of location / room overview page
    url: '/location'
    # Main page title shown on location/room navigation bar
    navbar_title: 'Location'
    # Show map on location main page.  Set `map: false` if you don't want to
    # display it.
    map:
      # Initial map center point
      home_coord: 33.4522049,-112.0706132
      # Alternative map providers can be found on https://leaflet-extras.github.io/leaflet-providers/preview/
      # The following do match the Bootstrap design not too badly:
      #   - Thunderforest.Neighbourhood
      #   - Esri.WorldTopoMap
      map_provider: "MapyCZ.Basic"
      default_zoom: 18


  program:
    # URL of program page
    url: '/program'

    # Time steps in program table
    time_steps: 5 # in minutes

    # Show intermediary time steps (next to full hours)
    show_alltimes: true
